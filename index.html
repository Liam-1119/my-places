<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c52">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>我的地點</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eef3ef;--ink:#0e2a26;--mut:#5d756f;--pine:#0f5c52;--pin:#f2a007;--card:#fff;--line:#d3ddd7}
@media (prefers-color-scheme:dark){:root{--bg:#101a18;--ink:#e6f0ec;--mut:#8fa8a1;--card:#192624;--line:#2a3b38;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:var(--pine);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;color:#fff}
.bar{display:flex;gap:8px}
.bar input{flex:1;min-width:0;border:0;border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:#0e2a26}
.bar button{border:0;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;background:var(--pin);color:#2b1c00}
.bar button.alt{background:rgba(255,255,255,.18);color:#fff;font-weight:500}
#say{font-size:13px;min-height:20px;margin-top:6px;opacity:.95}
#say.err{color:#ffd6c9}
main{flex:1;position:relative;min-height:0}
section{position:absolute;inset:0;overflow:auto;display:none}
section.on{display:block}
#v-map{overflow:hidden}
#map{height:100%;width:100%}
.fab{position:absolute;right:12px;bottom:14px;z-index:500;border:0;border-radius:50%;width:48px;height:48px;background:var(--card);color:var(--pine);font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.list{padding:12px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row .g{flex:1;min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
.d{color:var(--pine);font-weight:700;white-space:nowrap}
a{color:var(--pine);font-weight:600;text-decoration:none}
h3{margin:16px 2px 6px;font-size:17px}
h4{margin:10px 2px 4px;font-size:14px;color:var(--mut);font-weight:600}
.sm{border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px}
.empty{padding:32px 20px;text-align:center;color:var(--mut)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 0;font:inherit;font-size:14px}
nav button.on{color:var(--pine);font-weight:700;box-shadow:inset 0 3px 0 var(--pine)}
.pin{width:22px;height:22px;background:var(--pin);border:3px solid #0e2a26;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.leaflet-popup-content{font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#0e2a26}
</style>
</head>
<body>
<header>
  <div class="bar">
    <input id="url" placeholder="貼上 Google Map 連結" inputmode="url" autocomplete="off">
    <button id="go">加入</button>
    <button id="clip" class="alt">貼上</button>
  </div>
  <div id="say"></div>
</header>
<main>
  <section id="v-map" class="on"><div id="map"></div><button class="fab" id="loc" aria-label="回到我的位置">◎</button></section>
  <section id="v-near"><div class="list" id="near"></div></section>
  <section id="v-db"><div class="list" id="db"></div></section>
</main>
<nav id="nav">
  <button data-t="map" class="on">地圖</button>
  <button data-t="near">附近</button>
  <button data-t="db">資料庫</button>
</nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var places=[],me=null,tab='map',markers={},fitted=false,first=true;
try{places=JSON.parse(localStorage.getItem('places2')||'[]')}catch(e){}
function save(){try{localStorage.setItem('places2',JSON.stringify(places))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function gm(p){return p.url||('https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng)}
function dist(a,b){var R=6371000,r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2),y=Math.sin((b.lng-a.lng)*r/2);
 return 2*R*Math.asin(Math.sqrt(x*x+Math.cos(a.lat*r)*Math.cos(b.lat*r)*y*y))}
function fmt(m){return m<1000?Math.round(m)+' 公尺':(m/1000).toFixed(m<10000?1:0)+' 公里'}
function say(t,err){var e=$('#say');e.textContent=t;e.className=err?'err':''}

var map=L.map('map',{zoomControl:false}).setView([25.04,121.55],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
var layer=L.layerGroup().addTo(map),meDot=null;
var pinIcon=L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[22,22],iconAnchor:[6,24],popupAnchor:[5,-22]});

function setTab(t){
 tab=t;
 document.querySelectorAll('section').forEach(function(s){s.classList.toggle('on',s.id==='v-'+t)});
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
 if(t==='map')setTimeout(function(){map.invalidateSize()},50);
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});

function focusPlace(id){
 var p=places.filter(function(x){return x.id===id})[0];if(!p)return;
 setTab('map');
 setTimeout(function(){map.invalidateSize();map.setView([p.lat,p.lng],16);if(markers[id])markers[id].openPopup()},80);
}

function renderMap(){
 layer.clearLayers();markers={};
 places.forEach(function(p){
  var m=L.marker([p.lat,p.lng],{icon:pinIcon}).addTo(layer);
  m.bindPopup('<b>'+esc(p.name)+'</b><br>'+esc(p.city)+' '+esc(p.district)+'<br><a href="'+esc(gm(p))+'" target="_blank" rel="noopener">在 Google Map 開啟</a>');
  markers[p.id]=m;
 });
 if(!fitted&&places.length&&!me){
  map.fitBounds(L.latLngBounds(places.map(function(p){return[p.lat,p.lng]})).pad(.2),{maxZoom:16});fitted=true;
 }
}
function renderNear(){
 var h='';
 if(!places.length)h='<div class="empty">還沒有地點。到 Google Map 按「分享」，複製連結貼到上方就會自動加入。</div>';
 else if(!me)h='<div class="empty">定位中…請允許瀏覽器使用位置。</div>';
 else h=places.map(function(p){return{p:p,d:dist(me,p)}}).sort(function(a,b){return a.d-b.d}).map(function(x){
  return '<div class="row"><div class="g" onclick="focusPlace('+x.p.id+')"><b>'+esc(x.p.name)+'</b><span class="mut">'+esc(x.p.city)+' '+esc(x.p.district)+'</span></div><span class="d">'+fmt(x.d)+'</span><a href="'+esc(gm(x.p))+'" target="_blank" rel="noopener">開啟</a></div>'}).join('');
 $('#near').innerHTML=h;
}
function renderDb(){
 if(!places.length){$('#db').innerHTML='<div class="empty">還沒有地點。</div>';return}
 var g={};places.forEach(function(p){(g[p.city]=g[p.city]||{});(g[p.city][p.district]=g[p.city][p.district]||[]).push(p)});
 var h='';
 Object.keys(g).forEach(function(c){h+='<h3>'+esc(c)+'</h3>';
  Object.keys(g[c]).forEach(function(d){h+='<h4>'+esc(d)+'（'+g[c][d].length+'）</h4>';
   g[c][d].forEach(function(p){h+='<div class="row"><div class="g" onclick="focusPlace('+p.id+')"><b>'+esc(p.name)+'</b></div><a href="'+esc(gm(p))+'" target="_blank" rel="noopener">開啟</a><button class="sm" onclick="edit('+p.id+')">改分類</button><button class="sm" onclick="del('+p.id+')">刪除</button></div>'})})});
 h+='<h3>備份</h3><div class="row"><button class="sm" onclick="exp()">複製備份</button><button class="sm" onclick="imp()">匯入備份</button><span class="mut">資料存在這支手機的瀏覽器裡</span></div>';
 $('#db').innerHTML=h;
}
function render(){renderMap();renderNear();renderDb()}
function edit(id){var p=places.filter(function(x){return x.id===id})[0];
 var v=prompt('城市 / 區（用 / 分隔）',p.city+' / '+p.district);if(v===null)return;
 var a=v.split('/');p.city=(a[0]||'').trim()||p.city;p.district=(a[1]||'').trim()||p.district;save();render()}
function del(id){if(confirm('刪除這個地點？')){places=places.filter(function(p){return p.id!==id});save();render()}}
function exp(){var t=JSON.stringify(places);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){say('備份已複製')},function(){prompt('複製這段文字：',t)})}
function imp(){var v=prompt('貼上備份內容');if(!v)return;try{JSON.parse(v).forEach(function(p){if(!places.some(function(x){return x.id===p.id}))places.push(p)});save();render();say('已匯入')}catch(e){say('備份格式不正確',true)}}

function add(text){
 text=(text||'').trim();if(!text)return;
 say('解析中…');
 fetch('/api/resolve?url='+encodeURIComponent(text)).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'解析失敗');return d})})
 .then(function(d){
  var dup=places.filter(function(p){return Math.abs(p.lat-d.lat)<1e-5&&Math.abs(p.lng-d.lng)<1e-5})[0];
  if(dup){say('已經存過了：'+dup.name);focusPlace(dup.id);return}
  var p={id:Date.now(),name:d.name,city:d.city,district:d.district,lat:d.lat,lng:d.lng,url:d.url};
  places.push(p);save();$('#url').value='';say('已加入：'+p.name+'（'+p.city+' '+p.district+'）');render();focusPlace(p.id);
 }).catch(function(e){say(e.message,true)});
}
$('#go').onclick=function(){add($('#url').value)};
$('#url').addEventListener('paste',function(){setTimeout(function(){add($('#url').value)},0)});
$('#clip').onclick=function(){
 if(!navigator.clipboard||!navigator.clipboard.readText){say('這個瀏覽器不能讀剪貼簿，請長按輸入框貼上',true);return}
 navigator.clipboard.readText().then(add,function(){say('沒有剪貼簿權限，請長按輸入框貼上',true)});
};

function locate(){
 if(!navigator.geolocation){say('這個瀏覽器不支援定位',true);return}
 navigator.geolocation.watchPosition(function(pos){
  me={lat:pos.coords.latitude,lng:pos.coords.longitude};
  if(!meDot)meDot=L.circleMarker([me.lat,me.lng],{radius:8,color:'#fff',weight:3,fillColor:'#2f7de1',fillOpacity:1}).addTo(map);
  else meDot.setLatLng([me.lat,me.lng]);
  if(first){first=false;if(!fitted)map.setView([me.lat,me.lng],15)}
  renderNear();
 },function(){say('無法定位，請允許位置權限',true)},{enableHighAccuracy:true,maximumAge:10000});
}
$('#loc').onclick=function(){if(me)map.setView([me.lat,me.lng],16);else locate()};

render();locate();
var q=new URLSearchParams(location.search),sh=q.get('url')||q.get('text')||'';
if(sh){history.replaceState(null,'','/');add(sh)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
</script>
</body>
</html>
